<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b8e3e5" />
    <meta name="description" content="A small surfing simulator exploring wave and board physics." />
    <title>Breakline — Surf Simulator</title>
  </head>
  <body>
    <main id="app" aria-label="Surfing simulator">
      <div id="scene" aria-label="3D surf scene"></div>
      <div id="touch-controls" class="touch-controls" aria-label="Touch surf controls">
        <button id="touch-left" class="touch-button" type="button" aria-label="Steer left">←</button>
        <button id="touch-paddle" class="touch-button touch-paddle" type="button">Hold to paddle</button>
        <button id="touch-popup" class="touch-button touch-popup" type="button">Pop up</button>
        <button id="touch-crouch" class="touch-button touch-crouch" type="button">Crouch</button>
        <button id="touch-right" class="touch-button" type="button" aria-label="Steer right">→</button>
      </div>
      <div id="ui" class="ui"></div>
      <div id="loading" class="loading"><span class="loading-mark">B</span><span id="loading-text">Setting the break…</span></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
